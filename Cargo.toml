[package]
name = "brainpipe"
version = "0.1.0"
edition = "2021"

[lib]
name = "brainpipe"
crate-type = ["cdylib"]

[features]
# MuPDF: nécessite VS2019 toolset sur Windows — activer avec --features mupdf
default = []
mupdf = ["dep:mupdf"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.10.0"
walkdir = "2.5.0"
pdfium-render = { version = "0.8", features = ["image", "image_025"] }
mupdf = { version = "0.6", optional = true, default-features = false }
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
regex = "1.12.3"
image = "0.25.10"
itertools = "0.14.0"
ocrs = "0.12.2"
rten = "0.24.0"
rten-tensor = "0.24.0"
ort = { version = "2.0.0-rc.9", features = ["cuda", "directml", "coreml", "download-binaries"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", default-features = false }
calamine = { version = "0.26", default-features = false }
ndarray = "0.15"
memchr = "2"
num_cpus = "1"
serde_json = "1.0"
# Opt-6: LZ4 ultra-rapide (~500 MB/s) pour compresser le cache sled
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
# Opt-1: Canal haute performance pour le pipeline streaming
crossbeam-channel = "0.5"
# Opt-8: Allocateur mémoire haute performance (réduit la fragmentation)
mimalloc = "0.1"
# Lecteur de fichier Compound File Binary (CFB) pour Outlook .msg
cfb = "0.7"

[profile.release]
# Opt-7: Compilation agressive — LTO inter-crates, unite tous les codegen units
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
