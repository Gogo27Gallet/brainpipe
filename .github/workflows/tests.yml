name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m venv .venv
      - name: Activate project environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - run: python -m pip install 'maturin>=1.10,<2'
      - run: maturin develop --extras dev,api,cli,langchain,llamaindex,tokens
      - run: ruff check brainpipe tools
      - run: pytest -q --junitxml=test-results.xml
      - run: python tools/evaluate.py --output evaluation.json
      - run: python tools/evaluate_layout.py --output layout-evaluation.json
      - if: runner.os == 'Linux'
        run: python tools/fuzz_documents.py --rounds 40 --output mutation-smoke.json
      - if: runner.os == 'Linux'
        run: python tools/fuzz_documents.py --rounds 40 --pdf-layout reading_order --output mutation-layout-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            evaluation.json
            layout-evaluation.json
            mutation-smoke.json
            mutation-layout-smoke.json
