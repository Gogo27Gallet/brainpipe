name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m venv .venv
      - run: .venv/bin/pip install 'maturin>=1.5,<2'
      - run: .venv/bin/maturin develop --extras dev,api,cli,langchain
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/python download_pdfium.py
      - run: .venv/bin/ruff check brainpipe/api.py brainpipe/integrations/__init__.py brainpipe/integrations/langchain.py brainpipe/integrations/llamaindex.py tests/test_api.py tests/test_regressions.py download_pdfium.py
      - run: .venv/bin/pytest -q
