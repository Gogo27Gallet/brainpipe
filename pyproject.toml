[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "brainpipe"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "brainpipe/assets/TIKTOKEN_LICENSE.txt"]
description = "Fast and reliable document ingestion engine for AI pipelines."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/Gogo27Gallet/brainpipe"
Issues = "https://github.com/Gogo27Gallet/brainpipe/issues"

[project.scripts]
brainpipe = "brainpipe.cli:app"

[project.optional-dependencies]
cli = ["typer>=0.12,<1", "rich>=13,<16", "pypdf>=5,<8"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]
langchain = ["langchain-core>=0.3,<2"]
llamaindex = ["llama-index-core>=0.12,<1"]
tokens = ["tiktoken>=0.8,<1"]
browser-test = ["playwright>=1.49,<2"]
benchmark = ["psutil>=6,<8", "reportlab>=4,<5", "pymupdf>=1.25,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "brainpipe.brainpipe"
include = [{ path = "brainpipe/*.pyi", format = ["sdist", "wheel"] }, { path = "brainpipe/py.typed", format = ["sdist", "wheel"] }, { path = "brainpipe/static/**", format = ["sdist", "wheel"] }, { path = "brainpipe/assets/**", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
